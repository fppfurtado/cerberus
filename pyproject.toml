[project]
name = "cerberus"
version = "0.0.0"
description = "A guard between AI agents and confidential PostgreSQL databases: the only holder of the credential and the only path an agent's SQL takes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fernando Furtado" }]
requires-python = ">=3.12"
dependencies = [
    "pglast==8.8",
    "psycopg[binary]==3.3.9",
]

[project.scripts]
cerberus = "cerberus.cli:main"

[project.urls]
Repository = "https://github.com/fppfurtado/cerberus"
Issues = "https://github.com/fppfurtado/cerberus/issues"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerberus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
