name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install
        run: uv sync --locked
      - name: Test (synthetic PostgreSQL primary and standby, started by the fixture)
        run: uv run pytest -v
